<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sign up — Iron Lab</title><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/app.css"></head><body><main class="auth"><div class="auth-card glass"><a href="/" class="logo brand">IRON<span>LAB</span></a>
<h1>Join Iron Lab.</h1><p class="sub">Create your account, then choose a membership and book your first class.</p>
<form id="f" novalidate>
  <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
  <div class="field"><label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><small class="muted">At least 8 characters with a letter and a number.</small></div>
  <p class="form-err" role="alert"></p>
  <button class="btn btn-primary btn-block" type="submit">Create account</button>
</form>
<p class="alt">Already a member? <a href="/login.html">Log in</a></p>
</div></main><script src="/js/vendor/qrcode.js"></script><script src="/js/app.js"></script>
<script>
bindForm($('#f'), async (v) => {
  await api('/auth/signup', { body: v });
  const next = new URLSearchParams(location.search).get('next');
  location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/dashboard/member.html';
});
</script></body></html>
