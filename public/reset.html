<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>New password — Iron Lab</title><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/app.css"></head><body><main class="auth"><div class="auth-card glass"><a href="/" class="logo brand">IRON<span>LAB</span></a>
<h1>Choose a new password.</h1><p class="sub">Your reset link is valid for one hour.</p>
<form id="f" novalidate>
  <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
  <p class="form-err" role="alert"></p>
  <button class="btn btn-primary btn-block" type="submit">Update password</button>
</form>
</div></main><script src="/js/vendor/qrcode.js"></script><script src="/js/app.js"></script>
<script>
bindForm($('#f'), async (v, f) => {
  await api('/auth/reset-password', { body: { token: new URLSearchParams(location.search).get('token'), password: v.password } });
  f.innerHTML = '<p class="sub">Password updated.</p><a class="btn btn-primary btn-block" href="/login.html">Log in</a>';
});
</script></body></html>
