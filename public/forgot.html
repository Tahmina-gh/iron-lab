<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Forgot password — Iron Lab</title><link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/app.css"></head><body><main class="auth"><div class="auth-card glass"><a href="/" class="logo brand">IRON<span>LAB</span></a>
<h1>Reset password.</h1><p class="sub">Enter your email and we'll send you a reset link.</p>
<form id="f" novalidate>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
  <p class="form-err" role="alert"></p>
  <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
</form>
<p class="alt"><a href="/login.html">Back to log in</a></p>
</div></main><script src="/js/vendor/qrcode.js"></script><script src="/js/app.js"></script>
<script>
bindForm($('#f'), async (v, f) => { const r = await api('/auth/forgot-password', { body: v }); f.innerHTML = '<p class="sub" style="margin:0">' + esc(r.message) + '</p>'; });
</script></body></html>
